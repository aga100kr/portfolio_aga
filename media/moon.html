		<br><h1 style="margin-left:20px; margin-right:20px;" 
			data-en="A moon Encampment done by highschoolers without concience" data-pt="Um encampamento na lua feito no secundário por adolescentes desinteressados e inconcientes"></h1>
        <img src="images/moon/xpto.png" style="width:90%">
		<br><p style="margin-left:20px; margin-right:20px;" 
			data-en="While in secondary/high school, the challenge to design an encampment on the moon, coming from ESA (European Space Agency) was proposed to my group in Physics assignment. We didn’t have knowledge on about almost anything, but tried our best to deliver a nice product. I was resposible for the initial sketches and modeling on the required software, Fusion 360, while another member decided to try his ideas on 3d modeling on a different program, since he had more knowledge on modeling on Catia. On the submition day we didn’t have the model on the required Fusion’s file, and we only got an honorary certificate of participation."
			data-pt="Enquanto frequentava o ensino secundário, foi proposto ao meu grupo, no âmbito de um trabalho de Física, o desafio lançado pela ESA (Agência Espacial Europeia) de projetar um acampamento na Lua. Não tínhamos conhecimentos sobre praticamente nenhum dos temas envolvidos, mas procurámos fazer o nosso melhor para apresentar um resultado interessante. Fiquei responsável pelos primeiros esboços e pela modelação no software exigido, o Fusion 360, enquanto outro elemento do grupo decidiu experimentar as suas ideias de modelação noutro programa, uma vez que tinha mais conhecimentos de modelação em CATIA. No dia da entrega, não tínhamos o modelo no formato de ficheiro exigido pelo Fusion 360, pelo que acabámos por receber apenas um certificado honorário de participação."></p><br>
		<h3 style="margin-left:20px; margin-right:20px" data-en="Group: André Andrade, Bruno Faísca, Pedro Gonçalo, Rodrigo Serra" data-pt="Grupo: André Andrade, Bruno Faísca, Pedro Gonçalo, Rodrigo Serra"></h3><br>
        <h4 style="margin-left:20px; margin-right:20px;">Teacher: Maria Teresa, ESFundão</h4><br>
		<img src="images/moon/mcc.jpg" style="width:90%">
		<br><br>
        <img src="images/moon/mcc04.jpg" style="width:90%">
		<br><p style="margin-left:20px; margin-right:20px;"
			data-en="This project was meant to be modular, being constructed one module at a time, utilizing lunar regolith, allowing for more crew and improved communal living over its construction expansion. At its peak, would have modules for living, sleeping, hygiene/medical care, computational and chemical laboratories, also having a garage for rovers. Proved to be a simple intruduction to a method for further projects."
			data-pt="Este projeto foi concebido para ser modular, sendo construído um módulo de cada vez e utilizando regolito lunar, permitindo acomodar mais elementos da tripulação e melhorar as condições de vida comunitária à medida que a construção fosse expandida. Na sua configuração máxima, teria módulos destinados a habitação, dormitórios, higiene e cuidados médicos, laboratórios de computação e química, além de uma garagem para os rovers. Acabou por se revelar uma introdução simples a um método que poderia ser aplicado em projetos futuros."></p><br>
