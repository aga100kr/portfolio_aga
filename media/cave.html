		<br><br><p style="width: calc(100% - 40px); max-width: 900px; margin: 0 auto 20px; text-align: left; text-align: justify;" data-en="The entire project is based on the premisse of not taking footprint from the soil, but adapting to it and use it symbiotically. One such way was to use rain water and grey waters smartly to irrigate a local garden."

		<br><br><p style="width: calc(100% - 40px); max-width: 900px; margin: 0 auto 20px; text-align: left; text-align: justify;" data-en="The housing was developed in 2 sections: duplexes and simplexes. Since the houses sat flat on a slop, with terrain over their roofs, only one façade would have ventilation, hence the configuration present in the next drawings. Yet I proposed the flexibility to use the simplex as both an house or an comercial space."
					data-pt="O conjunto habitacional foi concebido em duas secções: duplexes e simplexes. Uma vez que as casas se situavam numa encosta, com o terreno a ultrapassar os seus telhados, apenas uma fachada teria ventilação, daí a configuração apresentada nos desenhos seguintes. No entanto, propus a flexibilidade de utilizar o simplex tanto como habitação como espaço comercial."></p>
