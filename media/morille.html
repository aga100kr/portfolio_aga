		<br><h1 style="margin-left:20px; margin-right:20px;"

		<p style="margin-left:20px; margin-right:20px"
			data-en="This project was conducted on the small village of Morille, where art is buried in an extensive grave. This remembered me of tales of ancient celtiberian rituals, megaliths and its monumentality. I aimed to create a ritual place, on a small scale, with the necessary lodging for 4 seperate artists, utilizing the present cabins on the spot, past country’s fronties cabins, to foster the graving act (the artist has to fell like of the frontier between life and death)."
			data-pt="Este projeto foi desenvolvido na pequena aldeia de Morille, onde a arte é enterrada numa extensa vala comum. Esta situação fez-me recordar histórias de antigos rituais celtibéricos, dos megálitos e da sua monumentalidade. O objetivo foi criar um lugar ritual, à pequena escala, com o alojamento necessário para quatro artistas distintos, reutilizando as cabanas existentes no local — antigas cabanas de fronteira — de forma a fomentar o ato de enterrar. O artista deve sentir-se como se estivesse na fronteira entre a vida e a morte."></p><br><br>
