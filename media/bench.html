		<br><p style="margin-left:20px; margin-right:20px;" 
				data-en="For 5th and last year in architecture I got into Erasmus Mobility, going to Chaniá, Crete, Greece. For the assignment of constructions with natural materials (Ειδικές κατασκευές με φυσικά υλικά), a small and quite challenging bench was conceived and made from local dirt and straw using adobe and earthen binders made in situ, hugging an olive tree, with the intent of being a first approach to the materials and techniques. 
			My role in this project was construction of stone wall/bench close to the tree and part of the earthen bench, the solar and usable orientation, modeling and 3d scans.
			Near building K4 in Technical University of Crete, Chaniá, Greece. Scanned with Polycam June 14 2025, circa 4 pm Greece time."
				data-pt="No meu 5.º e último ano de Arquitetura, entrei no programa de mobilidade Erasmus, indo para Chaniá, Creta, Grécia. No âmbito da unidade curricular de construções com materiais naturais (Ειδικές κατασκευές με φυσικά υλικά), foi concebido e construído um pequeno banco, bastante desafiante, utilizando terra e palha locais, através de adobe e ligantes de terra produzidos no local. O banco abraça uma oliveira, com a intenção de servir como uma primeira abordagem aos materiais e às técnicas.
			O meu papel neste projeto consistiu na construção do muro/banco de pedra junto à árvore e de parte do banco de terra, na definição da orientação solar e funcional, na modelação e na realização dos levantamentos 3D.
			Nas proximidades do edifício K4 da Universidade Técnica de Creta, Chaniá, Grécia. Digitalizado com Polycam a 14 de junho de 2025, por volta das 16h00 (hora da Grécia)."></p>
