<style>
.responsive {
  width: calc(100% - 60px);
  max-width: 1000px;
  height: auto;
}
body {color: white; text-align: center;}

* {  box-sizing: border-box;}

.center {  display: flex;  justify-content: center;  align-items: center;}
	
.column1 {	float: left;  width: 45%;  padding: 10px;}
	
.column2 { float: right;  width: 45%;  padding: 10px;}
/* Clear floats after the columns */
.row:after {  content: "";  display: table;  clear: both;}

/* PARALLAX BACKGROUND */

body {
    background: transparent !important;
    position: relative;
    isolation: isolate;
}

/* Camada de fundo */
body::before {
    content: "";
    position: fixed;
    top: -5vh;
    left: 0;
    width: 100%;
    height: 110vh;
    z-index: -1;
    pointer-events: none;

    background-image: url("images/a.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    opacity: 0.05;
    filter: grayscale(100%);
}

/* Movimento associado ao scroll */
@supports (animation-timeline: scroll()) {
    body::before {
        animation: parallax-background linear both;
        animation-timeline: scroll(root);
    }

    @keyframes parallax-background {
        from {
            transform: translate3d(0, -4vh, 0);
        }
        to {
            transform: translate3d(0, 4vh, 0);
        }
    }
}

/* Desativar movimento para quem prefere movimento reduzido */
@media (prefers-reduced-motion: reduce) {
    body::before {
        animation: none !important;
    }
}

/* Em telemóveis, evitar problemas com o movimento */
@media (max-width: 768px) {
    body::before {
        animation: none !important;
        background-position: center;
    }
}
</style>
