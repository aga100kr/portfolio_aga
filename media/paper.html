		<br><h1 style="margin-left:20px; margin-right:20px;" data-en="Papercrete and other paper experiences" data-pt="Papercrete e outras experiências com papel"></h1>
        <img src="images/paper/pa.png" style="width:90%">
		<br><br><p style="margin-left:20px; margin-right:20px" 
					data-en="Paper is something that is present in my life as a way of allowing me to do crafts since I was in my early years of school, and since then I’ve been experimenting with it, refining the mixtures and forms to a point I was able to even use what I created as an anvil, people even confusing it for stone."
					data-pt="Papel sempre foi um material que me permitiu desenvolver algumas competências e exercitar o meu cérebro, praticando estas manualidades desde que era muito novo. Tenho vindo a experimentar com este material, e especialmente em forma de papercrete ou papel machê com o fim de fazer maquetes duradouras, tendo evoluindo as misturas ao ponto de ter feito algumas que se confundiam com pedra, usando-a por vezes como bigorna."></p><br>
        <div class="row">
			<div class="center">
			<div class="column1">

			</div>

			<img src="images/paper/supsem.jpg" style="width:90%; height"
			</div></div></div>
		<br><p style="margin-left:20px; margin-right:20px"
					data-en="The phone holder that when flipped was used as an anvil and before coating looked like stone."
					data-pt="O suporte de telemóveis que quando voltado com a base para cima, pode ser usado como bigorna. Antes da pintura, parecia granito."></p><br>		
		<img src="images/boats/barcolimpo.png" style="width:90%"><br><br>
        <img src="images/paper/pblocos.png" style="width:90%"><br><br>
        <img src="images/paper/pmalga.png" style="width:90%">
		<br><p style="margin-left:20px; margin-right:20px"
					data-en="For that reason, I always intended to applying this techniques to architecture maquetes. Some teachers did like it, giving the idea of considering it as a possible building material, due to paper's properties - a rather good insulator - having easy workability and, in an ecological scope, being easy to recycle."
					data-pt="Por essa razão, sempre tentei aplicar estas técnicas que conhecia no âmbito da arquitetura para fazer maquetes. Certos professores gostaram da ideia, dando a ideia de se não se poderia aplicar na construção real, escala 1:1, pelas boas propriedades do papel, e por ser uma forma de reciclar. Foi um catalizador para a minha dissertação."></p><br>
