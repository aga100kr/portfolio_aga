			data-en="The proposal to redevelop Jardim de Almeida seeks to highlight the town’s historical heritage, using the silhouette of the city wall as a reference for the formal definition of the space. Inspired by the reflections of Juhani Pallasmaa, the project explores an immersive sensory experience, integrating natural and built elements with spaces for leisure, contemplation, exhibition, and recreation. The intervention extends to the surrounding public space, prioritizing pedestrian circulation, safety, and urban continuity, thereby strengthening the relationship between residents, the garden, and Almeida’s historical identity. The portfolio attached above also contains material for the course, since both proposals were part of the same assignment."
			data-pt="A proposta de requalificação do Jardim de Almeida procura valorizar o património histórico da vila, tomando a silhueta da muralha como referência para a definição formal do espaço. Inspirado nas reflexões de Juhani Pallasmaa, o projeto explora uma experiência sensorial imersiva, articulando elementos naturais e construídos com espaços de lazer, contemplação, exposição e recreio. A intervenção estende-se ao espaço público envolvente, privilegiando a circulação pedonal, a segurança e a continuidade urbana, reforçando a relação entre os habitantes, o jardim e a identidade histórica de Almeida. O portefólio anexado acima contem também materialpara trancoso, já que ambas as propostas se incluiam na mesma cadeira."></p><br>
