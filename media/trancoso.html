		<br><br><p style="width: calc(100% - 40px); max-width: 900px; margin: 0 auto 20px; text-align: left; text-align: justify;" data-en="My group developed an urban development proposal for a plot of land in Trancoso. On the upper level, my two colleagues designed a complex featuring shops, a plaza, and a parking lot, while I contributed technical drawings and helped develop the art gallery now on display. This underground gallery, located beneath the proposed plaza, was designed to maximize the sensory and visual experience of its visitors, emphasizing spatial quality and the connection to art."

					data-pt="O conjunto habitacional foi concebido em duas tipologias: duplexes e simplexes. Uma vez que as casas se situavam numa encosta, com o terreno a ultrapassar os seus telhados, apenas uma fachada teria ventilação, daí a configuração apresentada nos desenhos seguintes. No entanto, propus a flexibilidade de utilizar o simplex tanto como habitação como espaço comercial."></p><br><br>
