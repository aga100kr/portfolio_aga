										data-en="Master's Architecture student at University of Beira Interior, past in Electromechanics engineering. <br> Researching uses of urban solid waste in construction for my Master's Thesis. <br> I have solid empiric knowledge in technical drawing, 3D modeling and model making with alternative materials. Eager to find reliable and resource-efficient solutions for architecture, in both physical and digital environments.
										Also interested in History, FOSS and the Naval Industry. <br> As hobbies, I like to make models (not necessarily for architecture), play guitar and listen to music. <br> All works done without use of any so called AI.<br><br>Since I don't exactly know how to code, I'll vibecode this website, learning from AI, like the ever-present-tutor I dreamed as a child, and sites like  W3Schools, so any bug is a <i>feature</i> until I found out how to fix it."
										data-pt="Estudante de Mestrado em Arquitetura na Universidade da Beira Interior, anteriormente em Eletromecânica. <br> Atualmente, investigo a utilização de resíduos sólidos urbanos na construção para a minha dissertação de mestrado. <br> Tenho forte conhecimento empírico em desenho técnico, modelação 3D e construção de maquetes físicas com materiais alternativos. Procuro explorar soluções arquitetónicas fiáveis e eficientes na utilização de recursos, tanto no domínio físico como no digital.
										Também me Interesso por História, por software livre e de código aberto (FOSS) e pela indústria naval. <br> Nos meus tempos livres, gosto de fazer maquetes (não necessariamente de arquitetura), tocar guitarra e ouvir música. <br> Todos os trabalhos foram realizados sem uso de IA.<br><br>Já que eu não sei programar, estou a desenvolver este site com a ajuda de indicações da IA (como uma ferramenta que me dá a conhecer coisas que um motor de busca já não é capaz de mostrar) e de sites como o W3Schools, ao que qualquer erro que haja aqui, é uma <i>feature</i>."></p>

			<script>function setLanguage(lang) {document.querySelectorAll('[data-pt], [data-en]').forEach(element => {element.innerHTML = element.dataset[lang];});
					localStorage.setItem('language', lang);}const savedLanguage = localStorage.getItem('language') || 'en'; setLanguage(savedLanguage); </script>
			<script>const projectContainer = document.querySelector("#main");
				const projects = Array.from(projectContainer.querySelectorAll(".thumb"));
				document.querySelectorAll("[data-sort]").forEach(button => {button.addEventListener("click", function () {const mode = this.dataset.sort;
		        projects.sort((a, b) => {
	            const yearA = Number(a.dataset.year);
      		    const yearB = Number(b.dataset.year);
		            if (mode === "newest") {
             	   	return yearB - yearA;}
		
					if (mode === "oldest") {
               		return yearA - yearB;}
		        });
		        projects.forEach(project => {
            	projectContainer.appendChild(project);});
			    });});
